<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TVBox 文件传输</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#263238;font:16px sans-serif}.wrap{max-width:720px;margin:auto;padding:24px 16px}.panel{background:#fff;border-radius:12px;padding:22px;box-shadow:0 2px 12px #00000012}h1{font-size:24px;margin:0 0 8px}.hint{color:#78909c;margin-bottom:20px}.pick{display:block;text-align:center;padding:14px;border-radius:8px;background:#1976d2;color:#fff;cursor:pointer}.pick input{display:none}.progress{height:8px;background:#e3e8ed;border-radius:8px;margin:18px 0 8px;overflow:hidden}.bar{height:100%;width:0;background:#43a047;transition:width .15s}.status{color:#607d8b;font-size:14px}.item{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #eceff1;padding:13px 0}.item:first-child{border-top:0}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:12px}.del{border:0;background:#ffebee;color:#c62828;border-radius:6px;padding:7px 10px}.empty{color:#90a4ae;text-align:center;padding:22px 0}</style></head><body><main class="wrap"><section class="panel"><h1>TVBox 文件传输</h1><div class="hint">选择文件上传到电视的 TVBox/Transfer 目录</div><label class="pick">选择文件<input id="pick" type="file" multiple></label><div class="progress"><div id="bar" class="bar"></div></div><div id="status" class="status">等待上传</div><h3>已上传文件</h3><div id="list"></div></section></main><script>
var pick=document.getElementById('pick'),bar=document.getElementById('bar'),status=document.getElementById('status'),list=document.getElementById('list');
function size(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}
function report(n,p){fetch('transfer/progress',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'name='+encodeURIComponent(n)+'&progress='+p})}function load(){fetch('transfer/files').then(function(r){return r.json()}).then(function(a){list.innerHTML='';if(!a.length){list.innerHTML='<div class="empty">暂无文件</div>';return}a.forEach(function(f){var d=document.createElement('div');d.className='item';d.innerHTML='<span class="name">'+f.name+'<small> ('+size(f.size)+')</small></span><button class="del">删除</button>';d.querySelector('button').onclick=function(){if(confirm('删除 '+f.name+'？'))fetch('transfer/delete',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'name='+encodeURIComponent(f.name)}).then(load)};list.appendChild(d)})})}pick.onchange=function(){var fs=pick.files,i=0;bar.style.width='0';status.textContent='准备上传';report('',0);function next(){if(i>=fs.length){bar.style.width='0';status.textContent='等待上传';report('',0);pick.value='';load();return}var f=fs[i++],x=new XMLHttpRequest(),fd=new FormData();bar.style.width='0';status.textContent='准备上传 '+f.name;fd.append('file',f);fd.append('name',f.name);x.open('POST','transfer/upload');x.upload.onprogress=function(e){if(e.lengthComputable){var p=Math.round(e.loaded/e.total*100);bar.style.width=p+'%';status.textContent='正在上传 '+f.name+' ('+p+'%)';report(f.name,p)}};x.onload=next;x.onerror=function(){status.textContent='上传失败：'+f.name;next()};x.send(fd)}next()};load();</script></body></html>
